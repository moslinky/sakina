<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12614A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="سكينة">
<meta name="description" content="سكينة: القرآن الكريم، أوقات الصلاة والقبلة، الأذكار، وآيات وقصص تطمئن القلب">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap">
<title>سكينة</title>
<script>
  // يطبّق المظهر قبل الرسم حتى لا تومض الشاشة
  try {
    var t = JSON.parse(localStorage.getItem('sk.theme') || '"light"');
    if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<style>
/* التخطيط: عمود واحد بعرض الهاتف، رأس أخضر زمردي، أرضية عاجية فاتحة (أو خضراء في الوضع الداكن)، شريط تبويبات ثابت أسفل الشاشة */
@font-face { font-family: "Hafs"; src: url("UthmanicHafs.woff2") format("woff2"); font-display: swap; }
:root {
  --bg: #F6F1E4; --bg2: #EDE4CE; --surface: #FFFCF4; --surface2: #F7EFDC;
  --text: #1B2A24; --muted: #46574F; --faint: #66756D;
  --gold: #85600F; --deco: #B88A2E; --gold-soft: rgba(184,138,46,.14);
  --line: rgba(133,96,15,.30); --line-s: rgba(133,96,15,.16);
  --hero1: #157257; --hero2: #0D4A39; --on-hero: #FFF8E6; --on-hero-2: #F3D68F; --on-hero-muted: #D3E6DD;
  --chip-on: #0F5A44; --chip-on-text: #FFFFFF;
  --paper: #FFF9EA; --qtext: #13201B;
  --ok: #1C7A4E; --shadow: 0 6px 20px rgba(60,45,10,.08);
  --tab-bg: #FFFCF4;
  --f-q: "Amiri", "Traditional Arabic", "Times New Roman", serif;
  --f-ui: "Cairo", "Segoe UI", Tahoma, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #12372D; --bg2: #0D2B23; --surface: #19463B; --surface2: #1F5245;
  --text: #F7F1E1; --muted: #CDDAD2; --faint: #A6B9AF;
  --gold: #E8C97E; --deco: #D4AE5C; --gold-soft: rgba(232,201,126,.14);
  --line: rgba(232,201,126,.34); --line-s: rgba(232,201,126,.18);
  --hero1: #1C6551; --hero2: #12372D; --on-hero: #FFF8E6; --on-hero-2: #F3D68F; --on-hero-muted: #CFE2D9;
  --chip-on: #E8C97E; --chip-on-text: #0D2B23;
  --paper: #183F35; --qtext: #FBF6E9;
  --ok: #7FD3A6; --shadow: 0 6px 20px rgba(0,0,0,.25);
  --tab-bg: #0F2F27;
  color-scheme: dark;
}
* , *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--f-ui); font-size: 15px; line-height: 1.7; padding-top: env(safe-area-inset-top, 0px); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--hero1); z-index: 30; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--deco); outline-offset: 2px; }
input, select { font: inherit; color: var(--text); }
.app { max-width: 560px; margin: 0 auto; min-height: 100%; padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.stack { display: flex; flex-direction: column; gap: 12px; padding-block: 16px; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.small { font-size: 13px; } .center { text-align: center; }
.num { font-variant-numeric: tabular-nums; }

/* رأس الصفحات */
.hdr { background: linear-gradient(180deg, var(--hero1), var(--hero2)); color: var(--on-hero); padding-block: 12px 14px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.hdr h1 { margin: 0; font-size: 19px; line-height: 1.5; text-align: center; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr p { margin: 0; text-align: center; color: var(--on-hero-muted); font-size: 13px; }
.hbtn { width: 38px; height: 38px; flex: none; border-radius: 50%; border: 1px solid rgba(243,214,143,.45); display: grid; place-items: center; color: var(--on-hero-2); font-size: 20px; }
.hph { width: 38px; flex: none; }

/* البطاقات */
.card { display: block; width: 100%; text-align: right; background: var(--surface); border: 1px solid var(--line-s); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); position: relative; }
button.card:active { transform: scale(.99); }
.badge { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; font-weight: 600; color: var(--gold); background: var(--gold-soft); border: 1px solid var(--line-s); padding: 0 10px; border-radius: 99px; }
.ttl { font-weight: 700; font-size: 16px; color: var(--text); margin-top: 6px; line-height: 1.6; }
.src { display: block; color: var(--faint); font-size: 12.5px; margin-top: 6px; }
.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.q { font-family: var(--f-q); color: var(--qtext); line-height: 2; font-size: 20px; }
.qh { font-family: "Hafs", var(--f-q); }
.heart { position: absolute; left: 12px; top: 12px; width: 36px; height: 36px; display: grid; place-items: center; font-size: 19px; color: var(--faint); }
.heart.on { color: var(--deco); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.wrapchips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { flex: none; padding: 6px 15px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; color: var(--muted); font-weight: 600; }
.chip.on { background: var(--chip-on); border-color: var(--chip-on); color: var(--chip-on-text); }
.seg { display: flex; background: var(--surface2); border: 1px solid var(--line-s); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { flex: 1; padding: 8px; border-radius: 10px; font-weight: 700; font-size: 14px; color: var(--muted); }
.seg button.on { background: var(--chip-on); color: var(--chip-on-text); }
.cta { width: 100%; background: var(--chip-on); color: var(--chip-on-text); font-weight: 700; border-radius: 14px; padding: 13px; font-size: 15px; text-align: center; }
.ghost { width: 100%; border: 1px solid var(--line); color: var(--gold); font-weight: 700; border-radius: 14px; padding: 12px; font-size: 14px; text-align: center; background: var(--surface); }
.ghost.on { background: var(--chip-on); color: var(--chip-on-text); border-color: var(--chip-on); }
.acts { display: flex; gap: 10px; }
.acts > * { flex: 1; }
.search { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 11px 14px; font-size: 15px; }
.search::placeholder { color: var(--faint); }
h2.sec { font-size: 18px; margin: 22px 0 10px; display: flex; justify-content: space-between; align-items: baseline; }
h2.sec small { font-size: 13px; font-weight: 600; color: var(--gold); }
.orn { display: block; margin: 6px auto; color: var(--deco); }
.medal { width: 52px; height: 52px; flex: none; display: grid; place-items: center; position: relative; font-size: 22px; }
.medal svg { position: absolute; inset: 0; }
.medal span { position: relative; }

/* الرئيسية */
.hero { background: linear-gradient(180deg, var(--hero1), var(--hero2)); color: var(--on-hero); border-radius: 0 0 28px 28px; padding-block: 18px 20px; }
.hello small { display: block; color: var(--on-hero-muted); font-size: 13px; }
.hello h1 { margin: 0; font-size: 26px; line-height: 1.5; }
.hello .hij { color: var(--on-hero-2); font-size: 13px; }
.daily { display: block; width: 100%; margin-top: 16px; text-align: center; background: var(--paper); color: var(--qtext); border-radius: 20px; padding: 16px; border: 1px solid var(--line); }
.pill { display: inline-block; background: var(--chip-on); color: var(--chip-on-text); font-weight: 700; font-size: 12px; padding: 1px 12px; border-radius: 99px; }
.next-prayer { display: flex; align-items: center; gap: 12px; margin-top: 12px; background: rgba(255,255,255,.12); border: 1px solid rgba(243,214,143,.35); border-radius: 16px; padding: 10px 14px; color: var(--on-hero); width: 100%; text-align: right; }
.next-prayer b { font-size: 16px; } .next-prayer small { color: var(--on-hero-muted); display: block; font-size: 12.5px; }
.next-prayer .t { margin-inline-start: auto; font-size: 20px; font-weight: 700; color: var(--on-hero-2); }
.calmbtn { display: flex; align-items: center; gap: 12px; width: 100%; text-align: right; margin-top: 16px; padding: 14px 16px; border-radius: 18px; background: linear-gradient(200deg, rgba(31,140,110,.16), var(--surface)); border: 1px solid var(--line); box-shadow: var(--shadow); }
.calmbtn b { display: block; font-size: 16px; } .calmbtn small { color: var(--muted); font-size: 13px; }
.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.quick .card { padding: 12px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.quick b { font-size: 14.5px; } .quick small { font-size: 12px; color: var(--muted); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cat { min-height: 150px; padding: 14px; }
.cat b { display: block; font-size: 15px; margin-top: 6px; line-height: 1.5; }
.cat small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.6; }
.count { position: absolute; left: 12px; top: 12px; font-size: 11.5px; color: var(--gold); background: var(--gold-soft); padding: 0 8px; border-radius: 99px; }

/* صفحة العنصر */
.frame { margin-top: 14px; border: 1.5px solid var(--line); border-radius: 20px; padding: 6px; background: var(--paper); }
.frame > div { border: 1px solid var(--line-s); border-radius: 15px; padding: 20px 14px; text-align: center; }
.frame .q { font-size: 23px; }
.body { white-space: pre-line; line-height: 2; font-size: 16px; }
.body em { font-style: normal; font-family: var(--f-q); color: var(--gold); font-size: 18px; }
.pn { display: flex; gap: 10px; margin-block: 20px; }
.pn button { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line-s); border-radius: 14px; padding: 11px; color: var(--gold); font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* القرآن */
.sura { display: flex; align-items: center; gap: 12px; padding: 11px 14px; }
.snum { width: 34px; height: 34px; flex: none; display: grid; place-items: center; border: 1.5px solid var(--deco); border-radius: 9px; transform: rotate(45deg); }
.snum span { transform: rotate(-45deg); font-size: 13px; font-weight: 700; color: var(--gold); }
.sname { font-family: var(--f-q); font-size: 21px; flex: 1; min-width: 0; font-weight: 700; }
.smeta { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.mushaf { font-family: "Hafs", var(--f-q); color: var(--qtext); line-height: 2.2; text-align: justify; text-align-last: center; }
.ay { border-radius: 6px; cursor: pointer; transition: background .2s; }
.ay.hl { background: var(--gold-soft); box-shadow: 0 0 0 2px var(--gold-soft); }
.bism { text-align: center; font-family: "Hafs", var(--f-q); color: var(--qtext); margin-block: 6px; }
.sura-band { margin: 14px 0 6px; border: 1.5px solid var(--deco); border-radius: 12px; padding: 6px; text-align: center; font-family: var(--f-q); font-weight: 700; font-size: 20px; color: var(--gold); background: var(--gold-soft); position: relative; }
.sura-band::before, .sura-band::after { content: "۞"; position: absolute; top: 50%; transform: translateY(-50%); color: var(--deco); font-size: 18px; }
.sura-band::before { right: 12px; } .sura-band::after { left: 12px; }
.page { background: var(--paper); border-radius: 6px 18px 18px 6px; border: 1px solid var(--line); box-shadow: var(--shadow), inset -10px 0 18px -14px rgba(0,0,0,.25); padding: 8px; margin-top: 10px; }
.page-in { border: 2px double var(--deco); border-radius: 4px 12px 12px 4px; padding: 12px 12px 8px; min-height: 62vh; display: flex; flex-direction: column; }
.page-top { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--gold); font-weight: 600; border-bottom: 1px solid var(--line-s); padding-bottom: 4px; margin-bottom: 4px; }
.page-foot { margin-top: auto; text-align: center; padding-top: 8px; }
.page-foot span { display: inline-block; min-width: 46px; border: 1px solid var(--deco); border-radius: 99px; padding: 0 10px; font-size: 13px; color: var(--gold); font-weight: 700; }
.reader-tools { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; max-width: 560px; margin: 0 auto; max-height: 80vh; overflow: auto; background: var(--surface); border-top: 1px solid var(--line); border-radius: 22px 22px 0 0; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.grab { width: 44px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 10px; }

/* الصلاة والقبلة */
.ptable { display: flex; flex-direction: column; gap: 8px; }
.prow { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line-s); }
.prow .ic { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; background: var(--gold-soft); font-size: 17px; flex: none; }
.prow b { font-size: 16px; } .prow .tm { margin-inline-start: auto; font-size: 19px; font-weight: 700; }
.prow.next { background: var(--chip-on); color: var(--chip-on-text); border-color: var(--chip-on); }
.prow.next .ic { background: rgba(255,255,255,.18); }
.prow.past { opacity: .62; }
.countdown { text-align: center; padding-block: 8px; }
.countdown .big { font-size: 34px; font-weight: 700; color: var(--on-hero-2); line-height: 1.3; }
.compass { width: 260px; height: 260px; margin: 10px auto; position: relative; }
.compass svg { width: 100%; height: 100%; transition: transform .25s ease-out; }
.compass .needle { position: absolute; inset: 0; transition: transform .25s ease-out; }
.qibla-ok { color: var(--ok); font-weight: 700; }
select.search { appearance: auto; }

/* الأذكار */
.dk { padding: 16px; }
.dk .q { font-size: 19px; line-height: 2.05; white-space: pre-line; }
.dk.done { opacity: .55; }
.counter { margin-top: 12px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 11px; border-radius: 14px; background: var(--chip-on); color: var(--chip-on-text); font-weight: 700; font-size: 15px; }
.dk.done .counter { background: var(--surface2); color: var(--ok); border: 1px solid var(--line-s); }
.prog { height: 6px; border-radius: 6px; background: var(--surface2); overflow: hidden; margin-top: 8px; }
.prog i { display: block; height: 100%; background: var(--deco); border-radius: 6px; transition: width .3s; }
.feat { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.feat .card { padding: 14px 12px; text-align: center; }
.feat .card .e { font-size: 26px; display: block; }
.feat .card b { font-size: 14.5px; line-height: 1.5; display: block; }

/* السبحة والسكينة */
.tb { display: grid; place-items: center; margin: 14px auto 0; width: 250px; height: 250px; position: relative; }
.tb svg { position: absolute; inset: 0; }
.tb b { font-size: 62px; line-height: 1; position: relative; color: var(--text); }
.tb small { display: block; color: var(--muted); font-size: 13px; text-align: center; position: relative; }
.dh { font-family: var(--f-q); font-weight: 700; color: var(--gold); font-size: 28px; text-align: center; margin-top: 18px; }
.breath { width: 210px; height: 210px; margin: 16px auto 4px; border-radius: 50%; display: grid; place-items: center; position: relative; }
.breath::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, rgba(31,140,110,.35), rgba(31,140,110,.06) 70%); border: 2px solid var(--deco); animation: breathe 14s ease-in-out infinite; }
.breath span { position: relative; font-size: 21px; font-weight: 700; color: var(--text); }
@keyframes breathe { 0% { transform: scale(.6); } 28.5% { transform: scale(1); } 57% { transform: scale(1); } 100% { transform: scale(.6); } }
.sw { width: 50px; height: 28px; border-radius: 99px; background: var(--surface2); position: relative; flex: none; border: 1px solid var(--line); }
.sw::after { content: ""; position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--faint); transition: .2s; }
.sw.on { background: var(--chip-on); border-color: var(--chip-on); } .sw.on::after { right: 25px; background: #fff; }
.check { display: flex; gap: 10px; align-items: center; padding-block: 7px; width: 100%; text-align: right; font-size: 15px; }
.box { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--faint); display: grid; place-items: center; font-size: 13px; flex: none; }
.box.on { background: var(--chip-on); border-color: var(--chip-on); color: var(--chip-on-text); }
.steps { margin: 6px 0 0; padding-inline-start: 22px; line-height: 2; }
.code { display: inline-block; direction: ltr; font-family: ui-monospace, Menlo, monospace; background: var(--surface2); border: 1px solid var(--line-s); border-radius: 8px; padding: 0 8px; font-size: 14px; }

/* إشعار داخل التطبيق */
.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(12px + env(safe-area-inset-top, 0px)); width: min(520px, calc(100% - 24px)); background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; display: flex; gap: 10px; z-index: 60; box-shadow: 0 12px 30px rgba(0,0,0,.25); text-align: right; }
.toast b { display: block; font-size: 14px; color: var(--gold); }
.toast span { display: block; font-size: 14px; line-height: 1.7; }

/* التبويبات */
.tabs { position: fixed; bottom: 0; left: 0; right: 0; background: var(--tab-bg); border-top: 1px solid var(--line-s); z-index: 40; padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs > div { max-width: 560px; margin: 0 auto; display: flex; }
.tab { flex: 1; padding-block: 8px 7px; color: var(--faint); font-size: 11.5px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.tab.on { color: var(--chip-on); }
:root[data-theme="dark"] .tab.on { color: var(--gold); }
.tab svg { width: 24px; height: 24px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } .breath::before { animation-duration: 28s; } }
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs" aria-label="التبويبات"><div id="tabs"></div></nav>
<div id="toast"></div>
<div id="sheet"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
