const TABS=[['home','الرئيسية','M12 3l9 7v11h-6v-6H9v6H3V10z'],['quran','القرآن','M4 4h7a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4zM20 4h-7a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h7z'],['favs','المفضلة','M12 21s-7-4.6-9.3-9A5.2 5.2 0 0 1 12 6a5.2 5.2 0 0 1 9.3 6C19 16.4 12 21 12 21z'],['tasbih','السبحة','M12 4a3 3 0 1 1 0 6 3 3 0 0 1 0-6zm-6 6a3 3 0 1 1 0 6 3 3 0 0 1 0-6zm12 0a3 3 0 1 1 0 6 3 3 0 0 1 0-6zm-6 6a3 3 0 1 1 0 6 3 3 0 0 1 0-6z'],['rem','التذكيرات','M12 3a6 6 0 0 1 6 6v5l2 3H4l2-3V9a6 6 0 0 1 6-6zm-2 16h4a2 2 0 0 1-4 0z']];

/* =================== المحتوى المتجدد + القرآن =================== */
const AR_DIGITS = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
let DYN = load('dyn', {});            // كل العناصر المحمّلة من الإنترنت
let FEED = load('feed', []);          // آخر ما وصل (الأحدث أولاً)
const MEM = {};                        // ذاكرة مؤقتة للجلسة
const DYN_CAT = { hadith: 'أحاديث متجددة', ayah: 'آية وتفسير', dhikr: 'حصن المسلم', quran: 'القرآن الكريم' };
const H_ROOTS = [
  { id: 3, t: 'العقيدة' }, { id: 5, t: 'الفضائل والآداب' }, { id: 1, t: 'القرآن الكريم وعلومه' },
  { id: 4, t: 'الفقه وأصوله' }, { id: 7, t: 'السيرة والتاريخ' }, { id: 6, t: 'الدعوة والحسبة' }, { id: 2, t: 'الحديث وعلومه' },
];
const rnd = n => Math.floor(Math.random() * n);

async function api(url) {
  if (MEM[url]) return MEM[url];
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  MEM[url] = j;
  return j;
}
function saveDyn() {
  // نحتفظ بالمفضلة + آخر ما وصل، ونحذف الأقدم فقط إذا كثرت العناصر
  FEED = FEED.slice(0, 200);
  const keys = Object.keys(DYN);
  if (keys.length > 500) {
    const keep = new Set([...FEED, ...st.fav]);
    let extra = keys.length - 400;
    for (const k of keys) { if (extra <= 0) break; if (!keep.has(k)) { delete DYN[k]; extra--; } }
  }
  save('dyn', DYN); save('feed', FEED);
}
function addDyn(item, toFeed) {
  DYN[item.id] = item;
  if (toFeed && !FEED.includes(item.id)) FEED.unshift(item.id);
  saveDyn();
  return item;
}
function getItem(id) {
  const s = all.find(x => x.id === id);
  if (s) return s;
  const d = DYN[id];
  if (!d) return null;
  return { ...d, cat: { id: 'dyn', title: DYN_CAT[d.src] || 'سكينة', items: [] } };
}

// ---------- مصادر المحتوى ----------
function hadithItem(o) {
  let body = '';
  if (o.explanation) body += 'الشرح:\n' + o.explanation.trim();
  if (o.hints && o.hints.length) body += '\n\nمن فوائد الحديث:\n' + o.hints.map(h => '• ' + h).join('\n');
  body += '\n\nالمصدر: موسوعة الأحاديث النبوية (HadeethEnc.com)';
  return {
    id: 'h-' + o.id, src: 'hadith', type: 'hadith',
    title: o.title.length > 70 ? o.title.slice(0, 68) + '…' : o.title,
    text: o.hadeeth.trim(),
    source: [o.attribution, o.grade].filter(Boolean).join(' — '),
    body,
  };
}
async function loadHadith(id) {
  if (DYN['h-' + id]) return DYN['h-' + id];
  const o = await api(`https://hadeethenc.com/api/v1/hadeeths/one/?language=ar&id=${id}`);
  return addDyn(hadithItem(o), false);
}
async function randomHadith() {
  const meta = load('hmeta', {});
  const root = H_ROOTS[rnd(H_ROOTS.length)].id;
  let total = meta[root];
  if (!total) {
    const m = await api(`https://hadeethenc.com/api/v1/hadeeths/list/?language=ar&category_id=${root}&page=1&per_page=1`);
    total = +m.meta.total_items; meta[root] = total; save('hmeta', meta);
  }
  const page = 1 + rnd(total);
  const l = await api(`https://hadeethenc.com/api/v1/hadeeths/list/?language=ar&category_id=${root}&page=${page}&per_page=1`);
  const id = l.data[0].id;
  const o = await api(`https://hadeethenc.com/api/v1/hadeeths/one/?language=ar&id=${id}`);
  return addDyn(hadithItem(o), true);
}
async function loadAyahTafsir(ref) {
  const j = await api(`https://api.alquran.cloud/v1/ayah/${ref}/editions/quran-uthmani,ar.muyassar`);
  const [a, t] = j.data;
  return { a, t };
}
async function randomAyah() {
  const n = 1 + rnd(6236);
  const { a, t } = await loadAyahTafsir(n);
  return addDyn({
    id: 'a-' + a.surah.number + ':' + a.numberInSurah, src: 'ayah', type: 'ayah',
    title: a.surah.name.replace('سُورَةُ', 'سورة') + ' — الآية ' + AR_DIGITS(a.numberInSurah),
    text: a.text,
    source: a.surah.name.replace('سُورَةُ', 'سورة') + ' - الآية ' + a.numberInSurah,
    body: 'التفسير الميسر (مجمع الملك فهد):\n' + t.text,
  }, true);
}
async function hisnIndex() {
  let idx = load('hisnIdx', null);
  if (!idx) {
    const j = await api('https://www.hisnmuslim.com/api/ar/husn_ar.json');
    idx = j['العربية'].map(c => ({ id: c.ID, t: c.TITLE }));
    save('hisnIdx', idx);
  }
  return idx;
}
async function hisnChapter(id) {
  const j = await api(`https://www.hisnmuslim.com/api/ar/${id}.json`);
  const k = Object.keys(j)[0];
  return { title: k, items: j[k] || [] };
}
function dhikrItem(ch, x) {
  const rep = +x.REPEAT > 1 ? ` — يُكرَّر ${AR_DIGITS(x.REPEAT)} مرات` : '';
  return { id: 'd-' + x.ID, src: 'dhikr', type: 'dhikr', title: ch, text: String(x.ARABIC_TEXT || '').trim(), source: 'حصن المسلم' + rep };
}
async function randomDhikr() {
  const idx = await hisnIndex();
  const c = idx[rnd(idx.length)];
  const ch = await hisnChapter(c.id);
  if (!ch.items.length) throw new Error('empty');
  return addDyn(dhikrItem(ch.title, ch.items[rnd(ch.items.length)]), true);
}

// ---------- التحديث التلقائي ----------
let refreshing = false;
async function refreshFeed(force) {
  if (refreshing || !navigator.onLine) return;
  const last = load('lastFeed', 0);
  if (!force && FEED.length >= 6 && Date.now() - last < 3 * 3600e3) return;
  refreshing = true;
  const jobs = [randomHadith, randomHadith, randomHadith, randomAyah, randomAyah, randomDhikr, randomDhikr];
  await Promise.allSettled(jobs.map(f => f()));
  save('lastFeed', Date.now());
  refreshing = false;
  if (st.view === 'home' || st.view === 'feed') render();
}

// ---------- الشاشات: الجديد ----------
function feedCards(n) {
  const items = FEED.slice(0, n).map(getItem).filter(Boolean);
  if (!items.length) return `<div class="card" style="text-align:center;color:var(--muted)">${navigator.onLine ? 'جارٍ تحميل محتوى جديد…' : 'اتصل بالإنترنت ليصلك محتوى جديد'}</div>`;
  return items.map(itemCard).join('');
}
function feed() {
  return header('الجديد', 'يتجدّد تلقائياً كل بضع ساعات', true) + `<div class="wrap list">
  <button class="cta" onclick="moreFeed(this)">✨ حمّل محتوى جديداً الآن</button>${feedCards(60)}</div>`;
}
async function moreFeed(btn) {
  if (btn) { btn.disabled = true; btn.textContent = 'جارٍ التحميل…'; }
  await refreshFeed(true);
  if (btn) render();
}

// ---------- المكتبة المتجددة ----------
function lib() {
  return header('المكتبة المتجددة', 'آلاف الأحاديث والأذكار من مصادر موثوقة', true) + `<div class="wrap list">
  <div class="card"><b style="color:var(--gold-l);font-size:16px">📜 الأحاديث النبوية</b><p style="color:var(--muted);font-size:13px;margin:2px 0 10px">أحاديث مع درجتها وشرحها وفوائدها — موسوعة الأحاديث النبوية</p>
  <div class="wrapchips">${H_ROOTS.map(r => `<button class="chip" onclick="push('hcat',{libCat:${r.id},libPage:1})">${r.t}</button>`).join('')}</div></div>
  <button class="card" onclick="push('hisn')"><b style="color:var(--gold-l);font-size:16px">📿 حصن المسلم</b><p style="color:var(--muted);font-size:13px;margin:2px 0 0">أذكار الصباح والمساء، النوم، الهم والحزن، السفر… أكثر من 100 باب</p></button>
  <button class="card" onclick="push('rayah')"><b style="color:var(--gold-l);font-size:16px">📖 آية وتفسير</b><p style="color:var(--muted);font-size:13px;margin:2px 0 0">آية عشوائية من القرآن مع التفسير الميسر، اضغط لتحصل على آية جديدة كل مرة</p></button>
  <button class="card" onclick="push('feed')"><b style="color:var(--gold-l);font-size:16px">✨ الجديد</b><p style="color:var(--muted);font-size:13px;margin:2px 0 0">كل ما وصل تلقائياً من أحاديث وآيات وأذكار</p></button>
  </div>`;
}
function loading(msg) { return `<div class="card" style="text-align:center;color:var(--muted)">${msg || 'جارٍ التحميل…'}</div>`; }
function errBox(retry) { return `<div class="card" style="text-align:center;color:var(--muted)">تعذّر التحميل. تأكد من الاتصال بالإنترنت.<br><button class="chip" style="margin-top:10px" onclick="${retry}">إعادة المحاولة</button></div>`; }
function need(key, fn) {
  // يحمّل البيانات مرة واحدة ثم يعيد الرسم
  if (MEM['v:' + key] !== undefined) return MEM['v:' + key];
  MEM['v:' + key] = null;
  fn().then(v => { MEM['v:' + key] = v; render(); }).catch(() => { MEM['v:' + key] = 'ERR'; render(); });
  return null;
}
function retryKey(key) { delete MEM['v:' + key]; render(); }

function hcat() {
  const r = H_ROOTS.find(x => x.id === st.libCat);
  const pages = [];
  for (let p = 1; p <= st.libPage; p++) {
    const key = `hl-${st.libCat}-${p}`;
    const v = need(key, () => api(`https://hadeethenc.com/api/v1/hadeeths/list/?language=ar&category_id=${st.libCat}&page=${p}&per_page=20`));
    pages.push({ key, v });
  }
  let html = '', last = null, total = 0;
  for (const { key, v } of pages) {
    if (v === null) { html += loading(); break; }
    if (v === 'ERR') { html += errBox(`retryKey('${key}')`); break; }
    total = +v.meta.total_items; last = v;
    html += v.data.map(h => `<button class="card" onclick="openHadith('${h.id}',this)"><span class="badge">حديث</span><div class="it-title" style="margin-top:6px">${esc(h.title)}</div></button>`).join('');
  }
  const more = last && st.libPage < +last.meta.last_page ? `<button class="cta" onclick="st.libPage++;render()">تحميل المزيد ↓</button>` : '';
  return header(r.t, total ? AR_DIGITS(total) + ' حديث' : 'أحاديث نبوية', true) + `<div class="wrap list">${html}${more}<p class="note" style="text-align:center">المصدر: موسوعة الأحاديث النبوية HadeethEnc.com</p></div>`;
}
async function openHadith(id, el) {
  if (el) el.style.opacity = .6;
  try { const it = await loadHadith(id); push('item', { item: it.id }); }
  catch (e) { toast('تعذّر فتح الحديث، تأكد من الاتصال بالإنترنت'); if (el) el.style.opacity = 1; }
}
function hisn() {
  const v = need('hisnIdx', hisnIndex);
  const body = v === null ? loading() : v === 'ERR' ? errBox(`retryKey('hisnIdx')`) :
    `<input id="hisn-q" class="search" placeholder="ابحث عن ذكر… (النوم، السفر، الهم)" oninput="filterList('hisn-q','.hch')">` +
    v.map(c => `<button class="card hch" data-t="${esc(c.t)}" onclick="push('hisnch',{libCat:${c.id}})"><b style="font-size:15px">${esc(c.t)}</b></button>`).join('');
  return header('حصن المسلم', 'أذكار من الكتاب والسنة', true) + `<div class="wrap list">${body}</div>`;
}
function hisnch() {
  const key = 'hch-' + st.libCat;
  const v = need(key, () => hisnChapter(st.libCat));
  let title = 'حصن المسلم', body;
  if (v === null) body = loading();
  else if (v === 'ERR') body = errBox(`retryKey('${key}')`);
  else {
    title = v.title;
    body = v.items.map(x => { const it = dhikrItem(v.title, x); if (!DYN[it.id]) DYN[it.id] = it; return itemCard({ ...it, cat: null }); }).join('');
  }
  return header(title, '', true) + `<div class="wrap list">${body}<p class="note" style="text-align:center">المصدر: حصن المسلم — hisnmuslim.com</p></div>`;
}
function rayah() {
  const key = 'rayah-' + (st.rk || 0);
  const v = need(key, randomAyah);
  const body = v === null ? loading('جارٍ اختيار آية…') : v === 'ERR' ? errBox(`retryKey('${key}')`) :
    `<div class="frame"><div><div class="q">${esc(v.text)}</div>${orn(140)}<div style="color:var(--gold);font-size:13px">${esc(v.source)}</div></div></div>
     <div class="card body">${esc(v.body)}</div>
     <div class="acts"><button class="act ${st.fav.includes(v.id) ? 'on' : ''}" onclick="toggleFav('${v.id}')">${st.fav.includes(v.id) ? '♥ في المفضلة' : '♡ أضف للمفضلة'}</button><button class="act" onclick="shareItem('${v.id}')">↗ مشاركة</button></div>`;
  return header('آية وتفسير', 'التفسير الميسر', true) + `<div class="wrap" style="padding-block:18px">${body}<button class="cta" style="margin-top:16px" onclick="st.rk=(st.rk||0)+1;render()">📖 آية أخرى</button></div>`;
}
function filterList(inputId, sel) {
  const q = (document.getElementById(inputId).value || '').trim();
  document.querySelectorAll(sel).forEach(el => { el.hidden = q && !el.dataset.t.includes(q); });
}

// ---------- القرآن الكريم ----------
let QDATA=null;
async function qdata(){
  if(QDATA) return QDATA;
  const r=await fetch('quran.json'); if(!r.ok) throw new Error('quran');
  QDATA=await r.json(); return QDATA;
}
async function chapters(){ const q=await qdata(); return q.c.map((x,i)=>({n:i+1,name:x[0],place:x[1]==='m'?'makkah':'madinah',count:x[2]})); }
async function suraVerses(n){ const q=await qdata(); return q.v[n-1]; }
function quran() {
  const v = need('chapters', chapters);
  const lr = load('lastRead', null);
  let body;
  if (v === null) body = loading();
  else if (v === 'ERR') body = errBox(`retryKey('chapters')`);
  else {
    const cont = lr ? `<button class="card chal" onclick="openSura(${lr.n},${lr.v})">${medal('۞')}<div><small>متابعة القراءة</small><b>سورة ${esc(v[lr.n - 1].name)} — الآية ${AR_DIGITS(lr.v)}</b></div><span style="color:var(--faint)">‹</span></button>` : '';
    body = cont + `<input id="sura-q" class="search" placeholder="ابحث عن سورة…" oninput="filterList('sura-q','.sura')">` +
      v.map(s => `<button class="card sura" data-t="${esc(s.name)} ${s.n}" onclick="openSura(${s.n},1)"><span class="snum">${AR_DIGITS(s.n)}</span><span class="sname">سورة ${esc(s.name)}</span><span class="smeta">${s.place === 'makkah' ? 'مكية' : 'مدنية'} · ${AR_DIGITS(s.count)} آية</span></button>`).join('');
  }
  return header('القرآن الكريم', 'برواية حفص عن عاصم — بخط مجمع الملك فهد') + `<div class="wrap list">${body}
  <p class="note" style="text-align:center">الخط والنص: مصحف مجمع الملك فهد لطباعة المصحف الشريف (رواية حفص)</p></div>`;
}
function openSura(n, v) { push('sura', { sura: n, ayah: v || 1 }); }
function sura() {
  const n = st.sura;
  const chs = MEM['v:chapters'];
  const name = chs && chs !== 'ERR' ? chs[n - 1].name : (QDATA ? QDATA.c[n - 1][0] : '');
  const key = 'sura-' + n;
  const v = need(key, () => suraVerses(n));
  let body;
  if (v === null) body = loading();
  else if (v === 'ERR') body = errBox(`retryKey('${key}')`);
  else {
    const bism = n !== 1 && n !== 9 ? `<div class="bism">${esc(QDATA ? QDATA.v[0][0] : "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ")}</div>` : '';
    body = `<div class="mushaf" style="font-size:${st.qsize || 26}px">${bism}<p class="mtext">${v.map((t, i) => `<span class="ay" id="ay-${i + 1}" onclick="ayahSheet(${n},${i + 1})">${esc(t)}</span><span class="an">${AR_DIGITS(i + 1)}</span> `).join('')}</p></div>
      <div class="nav2" dir="ltr">${n < 114 ? `<button onclick="go('sura',{sura:${n + 1},ayah:1})">‹ السورة التالية</button>` : '<span style="flex:1"></span>'}${n > 1 ? `<button dir="rtl" onclick="go('sura',{sura:${n - 1},ayah:1})">› السورة السابقة</button>` : '<span style="flex:1"></span>'}</div>`;
    save('lastRead', { n, v: st.ayah || 1 });
    if (st.ayah > 1) setTimeout(() => { const el = document.getElementById('ay-' + st.ayah); if (el) { el.scrollIntoView({ block: 'center' }); el.classList.add('hl'); } }, 60);
  }
  const tools = `<div class="row" style="justify-content:center;gap:10px;margin-top:10px"><button class="chip" onclick="qsize(-2)">ـأ</button><span style="color:var(--muted);font-size:12px">حجم الخط</span><button class="chip" onclick="qsize(2)">أ+</button></div>`;
  return header('سورة ' + name, 'اضغط على أي آية لقراءة تفسيرها', true) + `<div class="wrap" style="padding-block:10px 18px">${tools}${body}</div>`;
}
function qsize(d) { st.qsize = Math.min(44, Math.max(18, (st.qsize || 26) + d)); save('qsize', st.qsize); const m = document.querySelector('.mushaf'); if (m) m.style.fontSize = st.qsize + 'px'; }
async function ayahSheet(n, v) {
  save('lastRead', { n, v });
  document.querySelectorAll('.ay.hl').forEach(e => e.classList.remove('hl'));
  const el = document.getElementById('ay-' + v); if (el) el.classList.add('hl');
  const sh = document.getElementById('sheet');
  const verses = QDATA ? QDATA.v[n - 1] : [];
  const nm = QDATA ? QDATA.c[n - 1][0] : '';
  const id = 'q-' + n + ':' + v;
  const fav = st.fav.includes(id);
  sh.innerHTML = `<div class="sheet-bg" onclick="closeSheet()"></div><div class="sheet" dir="rtl"><div class="grab"></div>
    <div class="row"><b style="color:var(--gold-l)">سورة ${esc(nm)} — الآية ${AR_DIGITS(v)}</b><button aria-label="إغلاق" onclick="closeSheet()" style="font-size:22px;color:var(--faint)">×</button></div>
    <div class="mushaf" style="font-size:24px;margin-top:6px">${esc(verses[v - 1] || '')}</div>
    <div id="tafsir" class="body" style="font-size:15px;color:var(--muted)">جارٍ تحميل التفسير…</div>
    <div class="acts"><button class="act ${fav ? 'on' : ''}" id="qfav" onclick="favAyah(${n},${v})">${fav ? '♥ في المفضلة' : '♡ أضف للمفضلة'}</button><button class="act" onclick="favAyah(${n},${v},true)">↗ مشاركة</button></div></div>`;
  try {
    const { t } = await loadAyahTafsir(n + ':' + v);
    const box = document.getElementById('tafsir');
    if (box) box.innerHTML = '<b style="color:var(--gold)">التفسير الميسر:</b>\n' + esc(t.text);
  } catch (e) { const box = document.getElementById('tafsir'); if (box) box.textContent = 'تعذّر تحميل التفسير، تأكد من الاتصال بالإنترنت.'; }
}
function closeSheet() { document.getElementById('sheet').innerHTML = ''; }
function favAyah(n, v, share) {
  const verses = QDATA ? QDATA.v[n - 1] : [];
  const nm = QDATA ? QDATA.c[n - 1][0] : '';
  const id = 'q-' + n + ':' + v;
  const tf = (document.getElementById('tafsir') || {}).textContent || '';
  addDyn({ id, src: 'quran', type: 'ayah', hafs: true, title: `سورة ${nm} — الآية ${AR_DIGITS(v)}`, text: verses[v - 1] || '', source: `سورة ${nm} - الآية ${v}`, body: tf.startsWith('التفسير') ? tf : '' }, false);
  if (share) { shareItem(id); return; }
  st.fav = st.fav.includes(id) ? st.fav.filter(x => x !== id) : [id, ...st.fav];
  save('fav', st.fav);
  const b = document.getElementById('qfav');
  if (b) { const on = st.fav.includes(id); b.classList.toggle('on', on); b.textContent = on ? '♥ في المفضلة' : '♡ أضف للمفضلة'; }
}
st.qsize = load('qsize', 26);
window.addEventListener('online', () => refreshFeed());
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshFeed(); });
setTimeout(() => refreshFeed(), 800);

// ---------- لحظة سكينة ----------
let calmTimer=null;
function calm(){
  const pool=DATA.cats.find(c=>c.id==='calm').items;
  if(st.calmIdx==null)st.calmIdx=rnd(pool.length);
  const v=pool[st.calmIdx%pool.length];
  clearInterval(calmTimer);
  const phases=[['شهيق…',4],['احبس…',4],['زفير…',6]];let p=0,left=phases[0][1];
  calmTimer=setInterval(()=>{const el=document.getElementById('bph');if(!el){clearInterval(calmTimer);return}left--;if(left<=0){p=(p+1)%3;left=phases[p][1]}el.textContent=phases[p][0]},1000);
  return header('لحظة سكينة','تنفّس ببطء مع الدائرة، واقرأ الآية بقلبك',true)+`<div class="wrap" style="padding-block:6px 20px">
  <div class="breath"><span id="bph">شهيق…</span></div>
  <p class="note" style="text-align:center">شهيق ٤ ثوانٍ · احبس ٤ · زفير ٦ — كرّرها ٦ مرات</p>
  <div class="frame"><div><div class="q qh" style="font-size:24px">${esc(v.text)}</div>${orn(140)}<div style="color:var(--gold);font-size:13px">${esc(v.source)}</div></div></div>
  <div class="card body" style="text-align:center">${esc(v.body)}</div>
  <div class="card" style="text-align:center;margin-top:12px"><small style="color:var(--muted)">ردّد مع كل زفير</small><div class="q" style="font-size:20px;color:var(--gold-l)">حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ</div></div>
  <div class="acts"><button class="act" onclick="st.calmIdx=(st.calmIdx||0)+1;render()">🤍 آية أخرى</button><button class="act ${st.fav.includes(v.id)?'on':''}" onclick="toggleFav('${v.id}')">${st.fav.includes(v.id)?'♥ في المفضلة':'♡ حفظ'}</button></div></div>`;
}

function render(){
  save('set',{interval:st.interval,enabled:st.enabled,quiet:st.quiet,qs:st.qs,qe:st.qe,cats:st.cats});
  const V={home,cat,item,favs,tasbih,rem,quran,sura,lib,feed,hcat,hisn,hisnch,rayah,calm};document.getElementById('app').innerHTML=V[st.view]();
  const top=['home','favs','tasbih','rem','quran'].includes(st.view)?st.view:null;
  document.getElementById('tabs').innerHTML=TABS.map(([k,l,d])=>`<button class="tab ${top===k?'on':''}" onclick="stack=[];go('${k}')"><svg viewBox="0 0 24 24" fill="${top===k?'currentColor':'none'}" stroke="currentColor" stroke-width="1.6"><path d="${d}"/></svg>${l}</button>`).join('');
}

function isStandalone(){return window.navigator.standalone===true||window.matchMedia('(display-mode: standalone)').matches}
function installCard(){if(isStandalone()||load('hideInstall',false))return '';const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
 return `<div class="wrap" style="margin-top:16px"><div class="card" style="border-color:var(--line)"><div class="row"><b style="color:var(--gold-l)">📲 ثبّت التطبيق على هاتفك</b><button aria-label="إخفاء" style="color:var(--faint);font-size:18px" onclick="save('hideInstall',true);render()">×</button></div><div style="font-size:13.5px;line-height:1.9;margin-top:4px">${ios?'في Safari: اضغط زر المشاركة <b>⬆︎</b> في الأسفل، ثم اختر <b>«إضافة إلى الشاشة الرئيسية»</b>، ثم <b>«إضافة»</b>.':'في Chrome: اضغط ⋮ في الأعلى، ثم <b>«تثبيت التطبيق»</b> أو <b>«إضافة إلى الشاشة الرئيسية»</b>.'}</div></div></div>`}
async function shareItem(id){const i=getItem(id);if(!i)return;const msg=`${i.title}\n\n${i.text}${i.source?`\n\n— ${i.source}`:''}\n\n📲 من تطبيق سكينة: ${location.href.split('#')[0]}`;
 try{if(navigator.share){await navigator.share({text:msg});return}await navigator.clipboard.writeText(msg);toast('تم نسخ النص، الصقه في واتساب أو أي مكان')}catch(e){}}
async function askNotif(){if(!('Notification' in window)){toast(/iphone|ipad/i.test(navigator.userAgent)&&!isStandalone()?'أضف التطبيق إلى الشاشة الرئيسية أولاً، ثم فعّل الإشعارات من داخله':'هذا المتصفح لا يدعم الإشعارات');return}
 const p=await Notification.requestPermission();toast(p==='granted'?'تم تفعيل الإشعارات ✅':'لم يتم السماح بالإشعارات')}
function inQuiet(d){if(!st.quiet)return false;const h=d.getHours(),a=st.qs,b=st.qe;return a<b?(h>=a&&h<b):(h>=a||h<b)}
function remindTick(){if(!st.enabled)return;const now=Date.now();let last=load('lastRem',0);if(!last){save('lastRem',now);return}
 if(now-last>=st.interval*60000&&!inQuiet(new Date())){save('lastRem',now);const pool=[...DATA.cats.filter(c=>st.cats.includes(c.id)).flatMap(c=>c.id==='calm'?[...c.items,...c.items]:c.items),...FEED.slice(0,60).map(id=>DYN[id]).filter(Boolean)];const i=pool[Math.floor(Math.random()*pool.length)];
  const T={ayah:'📖 آية تطمئن قلبك',hadith:'🌿 من هدي النبي ﷺ',dhikr:'📿 ذكر: ',story:'✨ قصة: ',lesson:'🕌 تعلّم: ',tip:'🤲 '}[i.type];const title=i.hafs?'🤍 '+i.title:(i.type==='ayah'||i.type==='hadith')?T:T+i.title;let b=i.notif||i.text;if(b.length>170)b=b.slice(0,167)+'…';
  toast(b,title,i.id);
  try{if('Notification' in window&&Notification.permission==='granted'&&navigator.serviceWorker)navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body:b,icon:'icon-192.png',badge:'icon-192.png',tag:'sakina'}))}catch(e){}}}
setInterval(remindTick,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)remindTick()});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
render();
</script>
